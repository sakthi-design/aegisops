version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aegisops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: incident_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enterprise_secure_password_replace_in_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: aegisops_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://postgres:enterprise_secure_password_replace_in_prod@db:5432/incident_platform
      LLM_PROVIDER: mock  # Or set to 'gemini' / 'openai' / 'ollama' with API key
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PII_MASKING_ENABLED: "true"
      SECRET_MASKING_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
